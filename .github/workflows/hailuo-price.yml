name: Hailuo Price Monitor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'fetch_prices.py'
      - 'requirements.txt'
      - '.github/workflows/hailuo-price.yml'
      - 'TRIGGER'
  schedule:
    - cron: '45 23 * * *' # 07:45 Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: hailuo-price-monitor
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        id: fetch
        continue-on-error: true
        run: python fetch_prices.py

      - name: Commit latest data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/last_good.json data/history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Hailuo prices $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      - name: Fail workflow if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
