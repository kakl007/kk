name: Hailuo Price Monitor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'fetch_prices.py'
      - 'fetch_prices_v2.py'
      - 'requirements.txt'
      - '.github/workflows/hailuo-price.yml'
      - 'TRIGGER'
  schedule:
    - cron: '17 20 * * *' # 04:17 Asia/Shanghai
    - cron: '47 21 * * *' # 05:47 Asia/Shanghai
    - cron: '47 22 * * *' # 06:47 Asia/Shanghai
    - cron: '17 23 * * *' # 07:17 Asia/Shanghai
    - cron: '47 23 * * *' # 07:47 Asia/Shanghai
    - cron: '17 0 * * *'  # 08:17 Asia/Shanghai
    - cron: '47 0 * * *'  # 08:47 Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: hailuo-price-monitor
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        id: fetch
        continue-on-error: true
        run: python fetch_prices_v2.py

      - name: Commit latest data
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/last_good.json data/history.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update Hailuo prices $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to push price data after 3 attempts."
              exit 1
            fi

            echo "Remote master advanced; rebasing fresh snapshot before retry."
            git fetch origin master
            git rebase -X theirs origin/master
            sleep $((attempt * 2))
          done

      - name: Fail workflow if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
